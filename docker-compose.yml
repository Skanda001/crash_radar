
services:
  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: crashradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crashradar
      POSTGRES_PASSWORD: crashradar
      POSTGRES_DB: crashradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Kafka (KRaft mode — no Zookeeper needed) ────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: crashradar-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ─── Service 1: Ingest Service (gRPC) ────────────────────────────
  ingest-service:
    build:
      context: .
      dockerfile: services/ingest-service/Dockerfile
    container_name: crashradar-ingest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://crashradar:crashradar@postgres:5432/crashradar
      KAFKA_BROKER: kafka:9092
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Service 2: Aggregator Worker (Kafka Consumer) ───────────────
  aggregator-worker:
    build:
      context: .
      dockerfile: services/aggregator-worker/Dockerfile
    container_name: crashradar-aggregator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://crashradar:crashradar@postgres:5432/crashradar
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Service 3: API Gateway (GraphQL) ────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: crashradar-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://crashradar:crashradar@postgres:5432/crashradar
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
